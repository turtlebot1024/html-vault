name: Deploy MCP Worker

# Phone-only deploy: trigger this from the GitHub mobile app / website
# (Actions tab -> "Deploy MCP Worker" -> Run workflow). No local computer needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare token with "Edit Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   VAULT_GITHUB_PAT       - fine-grained GitHub PAT, Contents R/W on html-vault-data
#                            (named VAULT_GITHUB_PAT because GITHUB_TOKEN is reserved)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set GITHUB_TOKEN secret on the worker
        run: printf '%s' "$VAULT_GITHUB_PAT" | npx wrangler secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAULT_GITHUB_PAT: ${{ secrets.VAULT_GITHUB_PAT }}
      - name: Show worker URL
        run: |
          echo "Deployed. Your MCP endpoint is:"
          echo "  https://html-vault-mcp.<your-workers-subdomain>.workers.dev/mcp"
          echo "Find the exact URL in the deploy step log above (the 'Published' line)."
