<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c4541f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>나의 HTML 보관소</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Spline+Sans+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #f4f1ea; --bg-card: #fffdf8; --ink: #1c1a17; --ink-soft: #6b655c;
    --line: #ddd6c9; --accent: #c4541f; --chip: #ece6da;
    --shadow: 18px 18px 0 rgba(28,26,23,0.06); --radius: 4px;
  }
  [data-theme="dark"] {
    --bg: #16140f; --bg-card: #211e18; --ink: #f0ebe0; --ink-soft: #9a9286;
    --line: #38332a; --accent: #e8772f; --chip: #2c281f;
    --shadow: 18px 18px 0 rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Fraunces', Georgia, serif; line-height: 1.5; min-height: 100vh;
    transition: background .3s, color .3s;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    padding-top: env(safe-area-inset-top);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 120px; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 20px; padding: 52px 0 28px;
  }
  .brand h1 {
    font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 600; line-height: .98;
    letter-spacing: -.02em; font-variation-settings: 'opsz' 120;
  }
  .brand h1 em { font-style: italic; color: var(--accent); }
  .brand p {
    font-family: 'Spline Sans Mono', monospace; font-size: .82rem;
    color: var(--ink-soft); margin-top: 10px; letter-spacing: .02em;
  }
  .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button, .btn {
    font-family: 'Spline Sans Mono', monospace; font-size: .8rem; font-weight: 500;
    border: 1.5px solid var(--ink); background: var(--bg-card); color: var(--ink);
    padding: 10px 16px; border-radius: var(--radius); cursor: pointer;
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  button:hover, .btn:hover { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(0,0); box-shadow: none; }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  #installBtn { display: none; }
  .toolbar {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    padding: 18px 0 26px; border-top: 1.5px solid var(--line);
  }
  .search {
    flex: 1 1 280px; display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--bg-card); padding: 11px 14px;
  }
  .search input {
    border: none; outline: none; background: transparent; width: 100%;
    font-family: 'Spline Sans Mono', monospace; font-size: .9rem; color: var(--ink);
  }
  .search svg { flex-shrink: 0; opacity: .5; }
  .tagbar { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 26px; }
  .tag {
    font-family: 'Spline Sans Mono', monospace; font-size: .74rem;
    padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--chip); color: var(--ink-soft); cursor: pointer; transition: all .15s;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--bg-card); border: 1.5px solid var(--ink); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden;
  }
  .card:hover { transform: translate(-3px,-3px); box-shadow: 22px 22px 0 rgba(196,84,31,0.12); }
  .card .num { font-family: 'Spline Sans Mono', monospace; font-size: .7rem; color: var(--ink-soft); letter-spacing: .08em; }
  .card h3 { font-size: 1.5rem; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
  .card .desc { color: var(--ink-soft); font-size: .98rem; white-space: pre-wrap; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .card .tags span {
    font-family: 'Spline Sans Mono', monospace; font-size: .68rem;
    background: var(--chip); color: var(--ink-soft); padding: 3px 9px; border-radius: 999px;
  }
  .card .date { font-family:'Spline Sans Mono',monospace; font-size:.66rem; color: var(--ink-soft); }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .card .row a, .card .row button {
    font-family: 'Spline Sans Mono', monospace; font-size: .74rem; text-decoration: none;
    padding: 7px 12px; border-radius: var(--radius); border: 1.5px solid var(--line);
    color: var(--ink); background: transparent; display: inline-flex; align-items: center; gap: 5px;
  }
  .card .row a:hover, .card .row button:hover { border-color: var(--accent); color: var(--accent); transform: none; box-shadow: none; }
  .card .mini { margin-left: auto; display: flex; gap: 6px; }
  .card .mini button { padding: 7px 10px; }
  .empty {
    text-align: center; padding: 90px 20px; color: var(--ink-soft);
    border: 2px dashed var(--line); border-radius: var(--radius); grid-column: 1/-1;
  }
  .empty strong { display: block; font-size: 1.4rem; color: var(--ink); margin-bottom: 8px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,14,.55); display: none;
    align-items: center; justify-content: center; padding: 24px; z-index: 50; backdrop-filter: blur(3px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg-card); border: 1.5px solid var(--ink); border-radius: var(--radius);
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 30px;
    box-shadow: 20px 20px 0 rgba(0,0,0,.2);
  }
  .modal h2 { font-size: 1.8rem; margin-bottom: 6px; }
  .modal .sub { font-family:'Spline Sans Mono',monospace; font-size:.76rem; color: var(--ink-soft); margin-bottom: 22px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-family: 'Spline Sans Mono', monospace; font-size: .74rem;
    color: var(--ink-soft); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .05em;
  }
  .field input, .field textarea {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--ink); font-family: 'Spline Sans Mono', monospace;
    font-size: .86rem; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field textarea.code { min-height: 200px; font-size: .78rem; line-height: 1.5; }
  .field .hint { font-family:'Spline Sans Mono',monospace; font-size:.68rem; color: var(--ink-soft); margin-top: 6px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  footer { text-align: center; font-family:'Spline Sans Mono',monospace; font-size: .72rem; color: var(--ink-soft); padding-top: 50px; }
  .fab {
    position: fixed; bottom: 30px; right: 30px; z-index: 40; width: 60px; height: 60px;
    border-radius: 50%; font-size: 1.6rem; background: var(--accent); color: #fff;
    border: 1.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
    bottom: calc(30px + env(safe-area-inset-bottom));
  }
  .preview-overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--bg);
    display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .preview-overlay.open { display: flex; }
  .preview-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1.5px solid var(--ink); background: var(--bg-card);
  }
  .preview-bar > span:first-child {
    font-family: 'Spline Sans Mono', monospace; font-size: .82rem; font-weight: 600;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .preview-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .preview-btns button { padding: 8px 12px; font-size: .76rem; }
  #previewFrame { flex: 1; width: 100%; border: none; background: #fff; }
  #updateBar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 70;
    background: var(--ink); color: var(--bg); border-radius: 999px;
    padding: 10px 14px 10px 20px; display: flex; align-items: center; gap: 12px;
    font-family: 'Spline Sans Mono', monospace; font-size: .8rem;
    box-shadow: 0 6px 24px rgba(0,0,0,.3); animation: slideUp .3s ease;
  }
  #updateBar button {
    background: var(--accent); color: #fff; border: none; padding: 7px 14px;
    border-radius: 999px; font-size: .76rem;
  }
  #updateBar button:hover { transform: none; box-shadow: none; }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #dbgPanel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    background: #0d0d0d; color: #00e676; font-family: 'Spline Sans Mono', monospace;
    font-size: .72rem; max-height: 45vh; display: none; flex-direction: column;
    border-top: 2px solid #00e676;
  }
  #dbgPanel.show { display: flex; }
  #dbgHead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #1a1a1a; color: #fff; flex-shrink: 0;
  }
  #dbgHead button {
    background: #333; color: #fff; border: 1px solid #555; padding: 4px 10px;
    font-size: .68rem; border-radius: 4px; margin-left: 6px;
  }
  #dbgHead button:hover { transform: none; box-shadow: none; background: #444; }
  #dbgLog { overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; line-height: 1.6; }
  #dbgLog .err { color: #ff5252; }
  #dbgLog .stop { color: #ffab40; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>나의 <em>HTML</em> 보관소</h1>
      <p id="counter">// CLAUDE와 만든 결과물 아카이브</p>
    </div>
    <div class="head-actions">
      <button id="installBtn" class="btn-accent">⤓ 앱 설치</button>
      <button id="themeBtn" title="테마 전환">◐ 테마</button>
      <button id="exportBtn">↓ 내보내기</button>
      <button id="importBtn">↑ 가져오기</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="제목 · 설명 · 태그 검색...">
    </div>
    <button class="btn-accent" id="addBtn">+ 새 카드 추가</button>
  </div>

  <div class="tagbar" id="tagbar"></div>
  <div class="grid" id="grid"></div>
  <footer>이 기기에 저장됩니다 (IndexedDB) · 내보내기로 백업하세요 · <span id="appVersion"></span></footer>
</div>

<button class="fab" id="fabBtn" title="새 카드">+</button>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-bar">
    <span id="previewTitle">미리보기</span>
    <span class="preview-btns">
      <button id="previewNewTab" title="새 탭에서 열기">↗ 새 탭</button>
      <button id="previewClose">✕ 닫기</button>
    </span>
  </div>
  <iframe id="previewFrame" sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe>
</div>

<div id="dbgPanel">
  <div id="dbgHead">
    <span>디버그 로그</span>
    <span>
      <button id="dbgCopy">복사</button>
      <button id="dbgClear">지우기</button>
      <button id="dbgHide">✕</button>
    </span>
  </div>
  <div id="dbgLog"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 카드</h2>
    <div class="sub">HTML 코드를 붙여넣으면 제목이 자동으로 채워지고 미리보기가 열립니다.</div>
    <input type="hidden" id="editId">
    <div class="field">
      <label>HTML 코드 (선택)</label>
      <textarea id="fCode" class="code" placeholder="<!DOCTYPE html> ... 여기에 붙여넣기"></textarea>
      <div class="hint">코드를 붙여넣으면 &lt;title&gt;을 읽어 제목을 자동 입력합니다.</div>
    </div>
    <div class="field">
      <label>제목</label>
      <input type="text" id="fTitle" placeholder="예: 선박주 PBR 비교 대시보드">
    </div>
    <div class="field">
      <label>설명 / 메모</label>
      <textarea id="fDesc" placeholder="어떤 결과물인지, 핵심 메모"></textarea>
    </div>
    <div class="field">
      <label>태그 (쉼표로 구분)</label>
      <input type="text" id="fTags" placeholder="투자, 대시보드, 로봇">
    </div>
    <div class="field">
      <label>대화 레퍼런스 링크</label>
      <input type="text" id="fRef" placeholder="https://claude.ai/chat/...">
    </div>
    <div class="modal-actions">
      <button id="cancelBtn">취소</button>
      <button class="btn-accent" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script>
/* ---------- 디버그 로거 ---------- */
function dbg(msg) {
  const log = document.getElementById('dbgLog');
  const panel = document.getElementById('dbgPanel');
  if (!log || !panel) { console.log('[dbg]', msg); return; }
  panel.classList.add('show');
  const line = document.createElement('div');
  const t = new Date().toLocaleTimeString();
  if (/오류|!!/.test(msg)) line.className = 'err';
  else if (/중단/.test(msg)) line.className = 'stop';
  line.textContent = `[${t}] ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
// 잡히지 않은 오류도 화면에 표시
window.addEventListener('error', e => {
  dbg('!! 전역 오류: ' + (e.message || e.error) + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', e => {
  dbg('!! Promise 오류: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

/* ---------- IndexedDB 저장 계층 ---------- */
const DB_NAME = 'html-vault', STORE = 'items', SETTINGS = 'settings';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(SETTINGS)) db.createObjectStore(SETTINGS, { keyPath: 'k' });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}
async function dbAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    tx.onsuccess = () => res(tx.result || []);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbPut(item) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).put(item);
    tx.onsuccess = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function dbDel(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
    tx.onsuccess = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function setSetting(k, v) {
  const db = await openDB();
  return new Promise((res) => {
    db.transaction(SETTINGS, 'readwrite').objectStore(SETTINGS).put({k, v}).onsuccess = () => res();
  });
}
async function getSetting(k) {
  const db = await openDB();
  return new Promise((res) => {
    const tx = db.transaction(SETTINGS, 'readonly').objectStore(SETTINGS).get(k);
    tx.onsuccess = () => res(tx.result ? tx.result.v : null);
    tx.onerror = () => res(null);
  });
}

/* ---------- 상태 ---------- */
let items = [];
let activeTag = null, query = '';

async function load() { items = await dbAll(); render(); }
function allTags() {
  const s = new Set();
  items.forEach(i => (i.tags||[]).forEach(t => s.add(t)));
  return [...s].sort();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ if(!ts) return ''; const d=new Date(ts); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }

function render() {
  document.getElementById('counter').textContent = `// ${items.length}개의 결과물 보관 중`;
  const tb = document.getElementById('tagbar'); tb.innerHTML = '';
  allTags().forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag' + (activeTag === t ? ' active' : '');
    el.textContent = '#' + t;
    el.onclick = () => { activeTag = activeTag === t ? null : t; render(); };
    tb.appendChild(el);
  });

  let list = items.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  if (activeTag) list = list.filter(i => (i.tags||[]).includes(activeTag));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(i =>
      (i.title||'').toLowerCase().includes(q) ||
      (i.desc||'').toLowerCase().includes(q) ||
      (i.tags||[]).join(' ').toLowerCase().includes(q));
  }

  const grid = document.getElementById('grid'); grid.innerHTML = '';
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty"><strong>아직 비어있어요</strong>오른쪽 아래 + 버튼으로 첫 결과물을 추가해보세요.</div>`;
    return;
  }
  list.forEach((it, idx) => {
    const card = document.createElement('div'); card.className = 'card';
    const n = String(list.length - idx).padStart(2,'0');
    const tagsHtml = (it.tags||[]).map(t => `<span>#${esc(t)}</span>`).join('');
    const refHtml = it.ref ? `<a href="${esc(it.ref)}" target="_blank" rel="noopener">↗ 대화 보기</a>` : '';
    const previewHtml = it.code ? `<button data-preview="${it.id}">▶ 미리보기 열기</button>` : '';
    card.innerHTML = `
      <span class="num">No.${n}</span>
      <h3>${esc(it.title||'제목 없음')}</h3>
      ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}
      ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
      <span class="date">${fmtDate(it.created)}</span>
      <div class="row">
        ${previewHtml}${refHtml}
        <span class="mini">
          <button data-edit="${it.id}" title="수정">✎</button>
          <button data-del="${it.id}" title="삭제">🗑</button>
        </span>
      </div>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('[data-preview]').forEach(b => b.onclick = () => preview(b.dataset.preview));
  grid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openModal(b.dataset.edit));
  grid.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del));
}

function preview(id) {
  dbg('--- 미리보기 시작 ---');
  try {
    dbg('1. id = ' + id);
    const it = items.find(i => i.id === id);
    dbg('2. 카드 찾음 = ' + (it ? 'O' : 'X'));
    if (!it) { dbg('중단: 카드를 못 찾음'); return; }
    dbg('3. code 길이 = ' + (it.code ? it.code.length : 0));
    if (!it.code) { dbg('중단: 코드 비어있음'); alert('이 카드에는 HTML 코드가 없어요. 연필(수정) 버튼을 눌러 코드를 넣어주세요.'); return; }
    const ov = document.getElementById('previewOverlay');
    dbg('4. previewOverlay = ' + (ov ? 'O' : 'X(없음!)'));
    const frame = document.getElementById('previewFrame');
    dbg('5. previewFrame = ' + (frame ? 'O' : 'X(없음!)'));
    if (!ov || !frame) { dbg('중단: 미리보기 요소가 없음 (파일 교체 안 됐을 수 있음)'); alert('미리보기 화면 요소가 없어요. index.html이 최신으로 교체됐는지 확인하세요.'); return; }
    frame.srcdoc = it.code;
    dbg('6. srcdoc 주입 완료');
    const titleEl = document.getElementById('previewTitle');
    if (titleEl) titleEl.textContent = it.title || '미리보기';
    dbg('7. 제목 설정 = ' + (titleEl ? 'O' : 'X'));
    const newTab = document.getElementById('previewNewTab');
    if (newTab) newTab.onclick = () => {
      const w = window.open('', '_blank');
      if (w) { w.document.open(); w.document.write(it.code); w.document.close(); }
      else alert('새 탭이 차단됐어요. 브라우저에서 이 사이트의 팝업을 허용해주세요.');
    };
    ov.classList.add('open');
    dbg('8. open 클래스 추가 → 화면에 떠야 함');
    // 실제로 보이는지 확인
    setTimeout(() => {
      const visible = getComputedStyle(ov).display;
      dbg('9. overlay display = ' + visible + (visible === 'none' ? ' (안 보임! CSS 문제)' : ' (정상)'));
    }, 50);
  } catch (err) {
    dbg('!! 오류 발생: ' + err.message);
    alert('미리보기 오류: ' + err.message);
  }
}
function closePreview(){
  const ov = document.getElementById('previewOverlay');
  document.getElementById('previewFrame').srcdoc = '';
  ov.classList.remove('open');
}

/* ---------- 입력 편의: 코드 붙여넣으면 title 자동 추출 ---------- */
function extractTitle(code) {
  const m = code.match(/<title[^>]*>([^<]*)<\/title>/i);
  if (m && m[1].trim()) return m[1].trim();
  const h1 = code.match(/<h1[^>]*>([^<]*)<\/h1>/i);
  if (h1 && h1[1].trim()) return h1[1].trim();
  return '';
}

function openModal(id) {
  document.getElementById('overlay').classList.add('open');
  const t = document.getElementById('modalTitle');
  if (id) {
    const it = items.find(i => i.id === id);
    t.textContent = '카드 수정';
    document.getElementById('editId').value = it.id;
    document.getElementById('fTitle').value = it.title||'';
    document.getElementById('fDesc').value = it.desc||'';
    document.getElementById('fTags').value = (it.tags||[]).join(', ');
    document.getElementById('fRef').value = it.ref||'';
    document.getElementById('fCode').value = it.code||'';
  } else {
    t.textContent = '새 카드';
    ['editId','fTitle','fDesc','fTags','fRef','fCode'].forEach(i => document.getElementById(i).value = '');
    setTimeout(()=>document.getElementById('fCode').focus(), 50);
  }
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

async function saveCard() {
  const id = document.getElementById('editId').value;
  const data = {
    title: document.getElementById('fTitle').value.trim(),
    desc: document.getElementById('fDesc').value.trim(),
    tags: document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    ref: document.getElementById('fRef').value.trim(),
    code: document.getElementById('fCode').value,
  };
  if (!data.title) { alert('제목을 입력하세요'); return; }
  if (id) {
    const it = items.find(i => i.id === id);
    Object.assign(it, data); await dbPut(it);
  } else {
    data.id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    data.created = Date.now();
    items.push(data); await dbPut(data);
  }
  closeModal(); render();
}
async function del(id) {
  if (!confirm('이 카드를 삭제할까요?')) return;
  items = items.filter(i => i.id !== id);
  await dbDel(id); render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(items,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'html-vault-backup.json'; a.click();
}
function importData(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw new Error('형식 오류');
      const merge = confirm(`${data.length}개 항목을 불러옵니다. 기존 데이터에 합칠까요? (취소 시 덮어쓰기)`);
      if (!merge) { for (const it of items) await dbDel(it.id); items = []; }
      for (const it of data) {
        if (!it.id) it.id = 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        if (!it.created) it.created = Date.now();
        await dbPut(it);
      }
      items = await dbAll(); render();
    } catch(e){ alert('가져오기 실패: ' + e.message); }
  };
  r.readAsText(file);
}

/* ---------- 이벤트 ---------- */
document.getElementById('addBtn').onclick = () => openModal();
document.getElementById('fabBtn').onclick = () => openModal();
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = saveCard;
document.getElementById('overlay').onclick = e => { if (e.target.id === 'overlay') closeModal(); };
document.getElementById('previewClose').onclick = closePreview;
document.getElementById('dbgClear').onclick = () => { document.getElementById('dbgLog').innerHTML = ''; };
document.getElementById('dbgHide').onclick = () => { document.getElementById('dbgPanel').classList.remove('show'); };
document.getElementById('dbgCopy').onclick = () => {
  const txt = document.getElementById('dbgLog').innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('로그 복사됨')).catch(()=>alert('복사 실패'));
  else alert(txt);
};
document.getElementById('searchInput').oninput = e => { query = e.target.value; render(); };
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); };
document.getElementById('themeBtn').onclick = async () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  await setSetting('theme', next);
};
// 코드 붙여넣을 때 title 자동 추출 (제목이 비어있을 때만)
document.getElementById('fCode').addEventListener('input', e => {
  const titleEl = document.getElementById('fTitle');
  if (!titleEl.value.trim()) {
    const t = extractTitle(e.target.value);
    if (t) { titleEl.value = t; }
  }
});

/* ---------- PWA 설치 ---------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});
document.getElementById('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
};

/* ---------- 버전 & 업데이트 감지 ---------- */
const APP_VERSION = 'v1.2';
document.getElementById('appVersion').textContent = APP_VERSION;

function showUpdateBar() {
  if (document.getElementById('updateBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBar';
  bar.innerHTML = `새 버전이 있어요 <button id="reloadBtn">새로고침</button>`;
  document.body.appendChild(bar);
  document.getElementById('reloadBtn').onclick = () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (reg && reg.waiting) reg.waiting.postMessage('skipWaiting');
      });
    }
    location.reload();
  };
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // 이미 대기 중인 새 버전이 있으면 알림
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
      // 새 버전이 설치되는 걸 감지
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
      // 주기적으로 업데이트 확인 (앱 켜둔 동안)
      setInterval(() => reg.update().catch(()=>{}), 60 * 1000);
    }).catch(()=>{});
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return; refreshing = true; location.reload();
    });
  });
}

/* ---------- 시작 ---------- */
(async () => {
  const t = await getSetting('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
  await load();
})();
</script>
